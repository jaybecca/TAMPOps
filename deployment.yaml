apiVersion: apps/v1
kind: Deployment
metadata:
  name: tampops
  labels:
    app: tampops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tampops
  template:
    metadata:
      labels:
        app: tampops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: tampops
          image: tampops:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
